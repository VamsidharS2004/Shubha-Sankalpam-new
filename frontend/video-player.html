<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/images/favicon-192.png">
<link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png">
<script>
(function(){var l="te";try{l=localStorage.getItem("ss_lang")||"te";}catch(e){}document.documentElement.lang=/^(en|te|hi)$/.test(l)?l:"te";})();
</script>

  <meta charset="UTF-8">
  <title>Shubha Sankalpam | Watch Video</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="assets/css/global.css">
  <style>
    body { background: #000; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .header { width: 100%; padding: 15px 20px; background: #111; display: flex; align-items: center; box-sizing: border-box; }
    .back-btn { background: #333; color: #fff; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-size: 16px; display: flex; align-items: center; gap: 8px; text-decoration: none; font-weight: bold; }
    .back-btn:hover { background: #444; }
    video { max-width: 100%; max-height: calc(100vh - 130px); outline: none; }
    .jump-row { padding: 10px 12px; display: none; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 100%; box-sizing: border-box; }
    .jump-btn { background: #b3261e; color: #fff; border: none; padding: 9px 16px; border-radius: 999px; cursor: pointer; font-size: 14px; font-weight: 700; max-width: 100%; }
    .jump-btn:hover { background: #cf3a31; }
    .jump-btn .jt { opacity: .85; font-weight: 600; margin-left: 4px; }
  </style>

  <!-- Favicon -->
<link rel="stylesheet" href="assets/css/content-layout.css?v=20261005-speed-v4">
</head>
<body>
  <div class="header">
    <a href="account.html" class="back-btn">&larr; Go Back</a>
  </div>
  <video id="player" controls autoplay playsinline></video>
  <div class="jump-row" id="jumpRow"></div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const rawUrl = urlParams.get('url') || '';
    const parts = rawUrl.split('#');
    const videoUrl = parts[0];
    const hashPart = parts.slice(1).join('#');

    /* Timestamps typed in the admin panel are kept in the link:  #ts=Name~seconds;Name~seconds  (names are URL-encoded).
       Older links with  #gotra=SECONDS  still work and show one "Go to gotra names" button. */
    function readStamps(hash) {
      const list = [];
      const ts = /(?:^|&)ts=([^&]*)/.exec(hash);
      if (ts) {
        ts[1].split(';').forEach(function (item) {
          const cut = item.lastIndexOf('~');
          if (cut < 1) return;
          const sec = parseInt(item.slice(cut + 1), 10);
          let name = item.slice(0, cut);
          try { name = decodeURIComponent(name); } catch (e) {}
          name = name.trim();
          if (name && Number.isFinite(sec) && sec >= 0) list.push({ name: name, seconds: sec });
        });
      }
      if (!list.length) {
        const g = /(?:^|&)gotra=(\d{1,6})(?:&|$)/.exec(hash);
        if (g && parseInt(g[1], 10) > 0) {
          const lang = document.documentElement.lang;
          const label = { te: 'గోత్రనామాల దగ్గరికి వెళ్ళండి', hi: 'गोत्र नाम पर जाएँ', en: 'Go to gotra names' }[lang] || 'Go to gotra names';
          list.push({ name: label, seconds: parseInt(g[1], 10) });
        }
      }
      return list.sort(function (a, b) { return a.seconds - b.seconds; });
    }
    function clock(total) {
      const h = Math.floor(total / 3600), m = Math.floor((total % 3600) / 60), s = String(total % 60).padStart(2, '0');
      return h ? h + ':' + String(m).padStart(2, '0') + ':' + s : m + ':' + s;
    }

    if (videoUrl) {
      const player = document.getElementById('player');
      player.src = videoUrl;
      const stamps = readStamps(hashPart);
      if (stamps.length) {
        const row = document.getElementById('jumpRow');
        stamps.forEach(function (st) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'jump-btn';
          btn.appendChild(document.createTextNode('\u25B6 ' + st.name));
          const t = document.createElement('span');
          t.className = 'jt';
          t.textContent = '(' + clock(st.seconds) + ')';
          btn.appendChild(t);
          btn.addEventListener('click', function () {
            player.currentTime = st.seconds;
            player.play().catch(function () {});
          });
          row.appendChild(btn);
        });
        row.style.display = 'flex';
      }
    } else {
      document.body.innerHTML = "<h2 style='color:white; margin:auto;'>Video not found</h2>";
    }
  </script>
</body>
</html>
