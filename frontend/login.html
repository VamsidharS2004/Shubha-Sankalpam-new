<!DOCTYPE html><!-- ================================================================
     LOGIN PAGE (login.html)
     ================================================================
     The login card text below can be edited directly in this file.
     The OTP send/verify logic lives in assets/js/auth.js.
     ================================================================ --><html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Anek+Telugu:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/global.css?v=client-20260923-1790184938020">
<link rel="stylesheet" href="assets/css/navbar.css?v=client-20260923-1790184938020">
<link rel="stylesheet" href="assets/css/forms.css?v=client-20260923-1790184938020">
<link rel="stylesheet" href="assets/css/animations.css?v=client-20260923-1790184938020">
<link rel="stylesheet" href="assets/css/responsive.css?v=client-20260923-1790184938020">  <!-- always last -->
<title data-cms-key="login.title.main">Login | Shubha Sankalpam</title>
<meta name="description" content="Login with OTP to book pujas, track your bookings, and receive your puja video.">
</head>
<body>
<div id="site-header"></div>

<div class="container">
  <div class="login-card" id="loginCard">
    <div class="login-avatar" id="loginAvatar">&#128241;</div>
    <h2 id="loginStepTitle">Login or Sign Up</h2>
    <p id="loginStepHint">We'll text you a one-time password (OTP) to verify it's you.</p>
    
    <!-- Step 1: Email + Phone -->
    <div class="login-fields" id="phoneStep">
      <div class="login-phone-wrapper">
        <select id="loginCountryCode" aria-label="Country Code">
          <option value="+91" selected="">🇮🇳 +91</option>
          <option value="+1">🇺🇸 +1</option>
          <option value="+44">🇬🇧 +44</option>
          <option value="+971">🇦🇪 +971</option>
          <option value="+65">🇸🇬 +65</option>
          <option value="+61">🇦🇺 +61</option>
        </select>
        <input type="tel" id="loginPhone" placeholder="Mobile Number" autocomplete="tel" required="" data-cms-key="login.placeholder.phone" data-cms-attr="placeholder">
      </div>
      <button class="login-big-btn" id="sendOtpBtn"><span data-cms-key="login.button.send_otp">Send OTP</span> <span class="login-arrow">&#8594;</span></button>
    </div>
    
    <!-- Step 2: Enter OTP -->
    <div class="login-fields hidden" id="otpStep">
      <input type="text" id="loginOtp" placeholder="Enter 4-digit OTP" maxlength="4" inputmode="numeric" autocomplete="one-time-code" data-cms-key="login.placeholder.otp" data-cms-attr="placeholder">
      <p class="demo-otp" id="demoOtp"></p>
      <button class="login-big-btn" id="verifyOtpBtn"><span data-cms-key="login.button.verify_otp">Verify OTP</span> <span class="login-arrow">&#8594;</span></button>
      <div id="resendWrap" style="text-align: center; margin-top: 12px; font-size: 0.9rem;">
        <span id="timerText" style="color: var(--muted); font-weight: 600;">Resend OTP in <span id="otpTimer">60</span>s</span>
        <button id="resendOtpBtn" class="hidden" style="color: var(--red); font-weight: 700; border: none; background: none; cursor: pointer; text-decoration: underline; text-underline-offset: 4px;" data-cms-key="login.button.resend_otp">Resend OTP</button>
      </div>
    </div>

    <!-- Step 3: Complete Profile -->
    <div class="login-fields hidden" id="profileStep">
      <input type="text" id="loginName" placeholder="Full Name" autocomplete="name" required="">
      <input type="text" id="loginGotram" placeholder="Gotram (optional)" autocomplete="off">
      <button class="login-big-btn" id="saveProfileBtn" data-cms-key="login.button.complete_profile">Complete Profile <span class="login-arrow">→</span></button>
    </div>
  </div>
</div>

<div id="site-footer"></div>
<!-- ============ CONTENT (edit these files to change text/prices/images) ============ -->
<script src="content/site-settings.js?v=client-20260923-1790184938020"></script>
<script src="content/pujas.js?v=client-20260923-1790184938020"></script>
<script src="content/packages.js?v=client-20260923-1790184938020"></script>
<script src="content/puja-detail-defaults.js?v=client-20260923-1790184938020"></script>
<script src="content/trust-highlights.js?v=client-20260923-1790184938020"></script>
<script src="content/faq.js?v=client-20260923-1790184938020"></script>

<!-- ============ SITE CODE (do not need to edit for content changes) ============ -->
<script src="assets/js/cms-renderer.js?v=client-20260923-1790184938020"></script>
<script src="assets/js/main.js?v=client-20260923-1790184938020"></script>
<script src="assets/js/navbar.js?v=client-20260923-1790184938020"></script>
<script src="assets/js/animations.js?v=client-20260923-1790184938020"></script>
<script src="assets/js/cards.js?v=client-20260923-1790184938020"></script>
<script src="assets/js/auth.js?v=client-20260923-1790184938020"></script>

</body></html>
