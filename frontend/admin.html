<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/global.css">
<link rel="stylesheet" href="assets/css/navbar.css">
<link rel="stylesheet" href="assets/css/account.css">
<title>Admin Dashboard | Shubha Sankalpam</title>
<style>
  .admin-login-container {
    max-width: 400px;
    margin: 80px auto;
    padding: 32px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    text-align: center;
  }
  .pwd-input-wrap {
    position: relative;
    margin: 24px 0;
  }
  .pwd-input-wrap input {
    width: 100%;
    padding: 14px 40px 14px 16px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-family: inherit;
    font-size: 1rem;
    box-sizing: border-box;
  }
  .pwd-input-wrap .toggle-pwd {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    font-size: 1.2rem;
    cursor: pointer;
    color: var(--muted);
  }
</style>
</head>
<body>
<div id="site-header"></div>

<div class="container" id="adminLoginView">
  <div class="admin-login-container">
    <h2>Admin Access</h2>
    <p class="muted">Enter the master password to manage bookings.</p>
    <div class="pwd-input-wrap">
      <input type="password" id="adminPwd" placeholder="Master Password" />
      <button class="toggle-pwd" id="togglePwd" title="Show Password">👁️</button>
    </div>
    <button class="btn btn-red" id="adminLoginBtn" style="width:100%; justify-content:center;">Access Dashboard</button>
    <p id="adminLoginErr" style="color:red; margin-top:12px; display:none; font-size:0.9rem;"></p>
  </div>
</div>

<div class="container" id="adminDashboardView" style="display:none; margin-top:40px;">
  <div class="panel-title">
    <span class="pt-icon">🛕</span><h2>Admin Dashboard</h2>
  </div>
  
  <div style="overflow-x: auto; margin-top: 24px;">
    <table style="width: 100%; border-collapse: collapse; text-align: left;">
      <thead>
        <tr style="border-bottom: 2px solid var(--line); color: var(--muted);">
          <th style="padding: 12px 16px;">Date</th>
          <th style="padding: 12px 16px;">Devotee</th>
          <th style="padding: 12px 16px;">Puja</th>
          <th style="padding: 12px 16px;">Status</th>
          <th style="padding: 12px 16px;">Action</th>
        </tr>
      </thead>
      <tbody id="adminBookingsTable">
        <!-- Rendered by admin.js -->
      </tbody>
    </table>
  </div>
</div>

<div id="site-footer"></div>
<script src="content/site-settings.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/navbar.js?v=2"></script>
<script src="assets/js/pages/admin.js"></script>
</body>
</html>
